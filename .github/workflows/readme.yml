name: Update README

# Status depends on today's date, so regenerate daily (00:05 Vietnam time) as well as on data changes.
# Pushes made with GITHUB_TOKEN do not retrigger workflows, so this cannot loop.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "README.md"]
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run readme
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README"
          git pull --rebase origin main
          git push
