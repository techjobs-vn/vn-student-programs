name: Update README

# Status depends on today's date, so regenerate daily (00:05 Vietnam time) as well as on data changes.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "README.md"]
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run readme
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README"
          git push
