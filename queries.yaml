# Bộ query cố định cho routine discover hằng ngày (xem ROUTINE.md).
# {year} = năm hiện tại và năm sau. Giữ ổn định để kết quả so sánh được giữa các lần chạy.

general:
  - "chương trình thực tập sinh công nghệ {year}"
  - "chương trình thực tập IT {year} sinh viên năm cuối"
  - "fresher program {year} Vietnam software"
  - "chương trình fresher {year} công nghệ thông tin"
  - "graduate program {year} Vietnam technology"
  - "management trainee {year} công nghệ ngân hàng"
  - "tech talent program {year} Việt Nam sinh viên"
  - "thực tập sinh tài năng {year} công nghệ"
  - "internship program {year} Vietnam data AI"
  - "chương trình đại sứ sinh viên công nghệ {year}"
  - "student ambassador {year} Vietnam tech company"
  - "early careers Vietnam {year} engineering intern"
  # Nhiều tập đoàn gọi chương trình là "đào tạo" chứ không phải "thực tập"
  - "chương trình đào tạo kỹ sư {year} miễn phí công nghệ"
  - "chương trình đào tạo nhân tài công nghệ {year} tuyển sinh"
  - "academy {year} đào tạo và tuyển dụng IT"
  # Gần công nghệ: vi mạch/phần cứng, product, UX/UI, data analytics, ngân hàng/fintech có nhánh công nghệ
  - "chương trình thực tập thiết kế vi mạch {year}"
  - "IC design internship program {year} Vietnam"
  - "embedded hardware internship program {year} Việt Nam"
  - "associate product manager program {year} Vietnam"
  - "product trainee {year} Việt Nam"
  - "UX UI design internship program {year} Việt Nam"
  - "data analyst trainee program {year} Việt Nam"
  - "chương trình thực tập phân tích dữ liệu {year}"
  - "chương trình thực tập sinh khối công nghệ ngân hàng {year}"
  - "technology graduate programme {year} Vietnam bank"

