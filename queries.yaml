# Trang tổng hợp chương trình: chỉ dùng để phát hiện, luôn tìm trang chính thức trên domain công ty.
aggregator_queries:
  - "site:ybox.vn fresher program {year}"
  - "site:ybox.vn \"Internship Program\" {year} software engineer chương trình"
  - "site:ybox.vn \"Talent Program\" {year} công nghệ chương trình tuyển dụng"
  - "chương trình academy tuyển dụng IT {year} miễn phí có lương"
  - "\"Internship Program {year}\" Vietnam software company"
  - "site:hocbongchosinhvien.com học bổng {year} thực tập công nghệ"

# Tập đoàn lớn hay có chương trình riêng nhưng chưa có trong data/programs.json: quét mỗi lần chạy.
extra_companies:
  - Vingroup
  - VinBigdata
  - VinUni
  - VinFast
  - VinAI
  - Viettel
  - VNPT
  - CMC
  - MISA
  - Samsung Việt Nam
  - LG Việt Nam
  - Bosch Việt Nam
  - Masan Technology

# Query theo công ty: xoay vòng, mỗi lần chạy lấy ~1/7 danh sách (theo thứ tự, tiếp nối lần trước).
per_company_template: "\"{company}\" (internship OR \"thực tập\" OR fresher OR \"graduate program\") {year}"

# Loại khỏi kết quả: job board tổng hợp tin lẻ, không phải trang chương trình.
exclude_domains:
  - topcv.vn
  - careerviet.vn
  - vn.indeed.com
  - jobs.vn.indeed.com
  - glassdoor.com
  - vietnamworks.com
  - itviec.com
